name: Build Minecraft Client JAR

on:
  push:
    branches: [ "**" ]   # har qanday branchga push bo'lsa build qilinadi
    tags: [ "v*" ]       # v tagdar push bo'lsa build + Release qilinadi
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Eskirgan pushni bekor qilish (resurs tejitish uchun)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle, Loom, Minecraft jar va yarn mappings keshlanadi.
      # Birinchi build sekin (~5-10 daq), keyingilar tez bo'ladi.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod JAR
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload Mod JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnormalClient-${{ github.run_number }}
          # Faqat ishlatiladigan remapped jar (dev/sources jarlarsiz)
          path: |
            build/libs/AnormalClient-*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

  # Faqat "v*" tag push qilinganda: jar GitHub Releases sahifasiga qo'shiladi
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: AnormalClient-${{ github.run_number }}
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
